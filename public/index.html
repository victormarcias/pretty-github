<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Docs — Victor Hugo Marcias</title>
  <meta name="description" content="Personal engineering knowledge base, read live from the dev-docs repo.">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9A</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="pretty-github.css">
  <link rel="stylesheet" href="language.css">
</head>

<body class="docs-body">
  <header class="docs-header">
    <a href="/" class="docs-home-link">&larr; <span class="docs-home-link-text">victormarcias.online</span></a>
    <h1 class="docs-title">📚 Dev Docs</h1>
    <div id="docs-lang-menu" class="docs-lang-menu">
      <button type="button" id="docs-lang-button" class="docs-lang-button" aria-haspopup="listbox" aria-expanded="false">
        <span class="docs-lang-flag" aria-hidden="true">🇬🇧</span>
        <span class="docs-lang-code">EN</span>
        <svg class="docs-lang-caret" viewBox="0 0 12 8" width="10" height="7" aria-hidden="true">
          <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <ul id="docs-lang-list" class="docs-lang-list" role="listbox" aria-label="Language" hidden>
        <li role="option" data-lang="es" aria-selected="false"><span class="docs-lang-flag" aria-hidden="true">🇪🇸</span> Español</li>
        <li role="option" data-lang="en" aria-selected="true"><span class="docs-lang-flag" aria-hidden="true">🇬🇧</span> English</li>
      </ul>
    </div>
    <span class="docs-header-spacer"></span>
    <button id="docs-sidebar-toggle" class="docs-sidebar-toggle" type="button" aria-label="Toggle contents" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <div class="docs-layout">
    <nav id="docs-sidebar" class="docs-sidebar" aria-label="Contents">
      <div class="docs-search-wrap">
        <input id="docs-search" class="docs-search" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
        <button type="button" id="docs-search-clear" class="docs-search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="3" y1="3" x2="13" y2="13"></line>
            <line x1="13" y1="3" x2="3" y2="13"></line>
          </svg>
        </button>
      </div>
      <div id="docs-tree-container">
        <div class="docs-status">Loading contents&hellip;</div>
      </div>
    </nav>
    <div id="docs-sidebar-backdrop" class="docs-sidebar-backdrop"></div>
    <main id="docs-content" class="docs-content">
      <div id="docs-content-inner" class="markdown-body">
        <div class="docs-status">Loading&hellip;</div>
      </div>
      <button type="button" id="docs-scroll-top" class="docs-scroll-top" aria-label="Back to top">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked-gfm-heading-id/3.2.0/index.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="filetree.js"></script>
  <script src="language.js"></script>
  <script src="pretty-github.js"></script>
</body>

</html>
